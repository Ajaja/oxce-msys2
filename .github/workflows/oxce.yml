name: OXCE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout OXCE repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: 'MeridianOXC/OpenXcom'
          ref: ${{ inputs.commit }}

      - name: Checkout MINGW-packages repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: 'msys2/MINGW-packages'
          path: 'MINGW-packages'

      - name: Setup MSYS2 (UCRT64 environment)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            patch
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-winpthreads            
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL
            mingw-w64-ucrt-x86_64-SDL_image
            mingw-w64-ucrt-x86_64-SDL_gfx
            mingw-w64-ucrt-x86_64-SDL_mixer

      - name: Extract version info
        id: version
        shell: msys2 {0}
        run: |
          VERSION=$(sed -n 's/.*OPENXCOM_VERSION_LONG "\([0-9]*\.[0-9]*\.[0-9]*\)\.[0-9]*".*/\1/p' src/version.h)
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(git log -1 --format=%cs)
          ARTIFACT_NAME="OXCE-${VERSION}-${COMMIT}-${DATE}-win64"
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT

      - name: Prepearing deps
        shell: msys2 {0}
        run: |
          export PKG_CONFIG="pkg-config --static"
          sed -i 's|Requires: sdl >= 1.2.10|Requires:  sdl >= 1.2.10 libjpeg libpng libtiff-4 libwebp|' /ucrt64/lib/pkgconfig/SDL_image.pc
          cd MINGW-packages

          cd mingw-w64-libvorbis
          sed -i 's|--enable-shared|--disable-shared|' PKGBUILD
          MINGW_ARCH=ucrt64 makepkg-mingw -sCLf --noconfirm
          pacman -U --noconfirm  *.pkg.tar.zst
          cd ..

          cd mingw-w64-libmikmod
          sed -i 's|--enable-shared|--disable-shared|' PKGBUILD
          MINGW_ARCH=ucrt64 makepkg-mingw -sCLf --noconfirm
          pacman -U --noconfirm  *.pkg.tar.zst
          cd ..

          cd mingw-w64-SDL_mixer
          sed -i 's|--enable-shared|--disable-shared CFLAGS="-DFLAC__NO_DLL -DMIKMOD_STATIC -Wno-error=incompatible-pointer-types" LIBS="-lvorbis -logg"|' PKGBUILD
          MINGW_ARCH=ucrt64 makepkg-mingw -sCLf --noconfirm
          pacman -U --noconfirm  *.pkg.tar.zst 
          cd ..

          sed -i 's|Requires: sdl >= 1.2.10|Requires:  sdl >= 1.2.10 vorbisfile vorbis ogg flac mad libmikmod|' /ucrt64/lib/pkgconfig/SDL_mixer.pc
          
      - name: Configure and build OpenXcom (Release static)
        shell: msys2 {0}
        run: |
          rm -rf deps
          mkdir -p build
          cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDEV_BUILD=OFF \
            -DBUILD_PACKAGE=OFF \
            -DPKG_CONFIG_ARGN="--static" \
            -DCMAKE_CXX_FLAGS="-s -static" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++ -Wl,--strip-all"

          cmake --build . --config Release --parallel $(nproc)
          cp bin/openxcom.exe ../bin/OpenXcomEx.exe
          cd ../bin
          zip -r "${{ steps.version.outputs.artifact_name }}.zip" ./*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}.zip
          path: bin
          if-no-files-found: error
          retention-days: 30

      - name: Create annotated tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.artifact_name }}"
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Create a proper *annotated* tag object with an explicit tagger
          # date (right now). Annotated tags store their own creation
          # timestamp, unlike lightweight tags, whose "creation date" is
          # just borrowed from whatever commit they happen to point at.
          # Without this, letting the release action auto-create the tag
          # produces a lightweight tag pinned to this repo's stale default
          # branch tip, so every release ends up showing the same old date.
          TAG_SHA=$(gh api "repos/$REPO/git/tags" \
            -f tag="$TAG" \
            -f message="$TAG" \
            -f object="$SHA" \
            -f type=commit \
            -f "tagger[name]=github-actions[bot]" \
            -f "tagger[email]=github-actions[bot]@users.noreply.github.com" \
            -f "tagger[date]=$NOW" \
            --jq .sha)

          gh api "repos/$REPO/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$TAG_SHA"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.artifact_name }}
          name: ${{ steps.version.outputs.artifact_name }}
          files: bin/${{ steps.version.outputs.artifact_name }}.zip
