name: OpenXcom

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout OXCE repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: 'OpenXcom/OpenXcom'

      - name: Checkout MINGW-packages repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: 'msys2/MINGW-packages'
          path: 'MINGW-packages'

      - name: Setup MSYS2 (UCRT64 environment)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            patch
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-winpthreads            
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL

      - name: Extract version info
        id: version
        shell: msys2 {0}
        run: |
          VERSION="git"
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(git log -1 --format=%cs)
          ARTIFACT_NAME="OpenXcom-${VERSION}-${COMMIT}-${DATE}-win64"
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT

      - name: Prepearing deps
        shell: msys2 {0}
        run: |
          cd MINGW-packages/mingw-w64-SDL_mixer
          sed -i 's|--enable-shared|--disable-shared CFLAGS="-DFLAC__NO_DLL" CXXFLAGS="-DFLAC__NO_DLL"|' PKGBUILD
          MINGW_ARCH=ucrt64 makepkg-mingw -sCLf --noconfirm
          pacman -U --noconfirm  *.pkg.tar.zst 

          cd ../mingw-w64-SDL_gfx
          sed -i 's|--enable-shared|--disable-shared|' PKGBUILD
          MINGW_ARCH=ucrt64 makepkg-mingw -sCLf --noconfirm
          pacman -U --noconfirm  *.pkg.tar.zst 

          cd ../mingw-w64-yaml-cpp
          sed -i 's|cd "${srcdir}/build-${MSYSTEM}-shared"|cd "${srcdir}/build-${MSYSTEM}-static"|' PKGBUILD
          MINGW_ARCH=ucrt64 makepkg-mingw -sCLf --noconfirm
          pacman -U --noconfirm  *.pkg.tar.zst 

          sed -i 's|Requires: sdl >= 1.2.10|Requires: sdl >= 1.2.10 vorbisfile vorbis ogg flac mad|' /ucrt64/lib/pkgconfig/SDL_mixer.pc
          sed -i 's|Requires: sdl >= 1.2.10|Requires: sdl >= 1.2.10 libjpeg libpng libtiff-4 libwebp|' /ucrt64/lib/pkgconfig/SDL_image.pc
          
      - name: Configure and build OpenXcom (Release static)
        shell: msys2 {0}
        run: |

          sed -i 's|include_directories ( SYSTEM ${SDLIMAGE_INCLUDE_DIR} )|find_package ( PkgConfig REQUIRED )\n    pkg_check_modules ( SDLIMAGE REQUIRED SDL_image )\n    set ( SDLIMAGE_LIBRARY ${SDLIMAGE_STATIC_LIBRARIES} )|' CMakeLists.txt
          sed -i 's|set ( SDLMIXER_LIBRARY "${SDLMIXER_LIBRARY} -lwinmm" )|find_package ( PkgConfig REQUIRED )\n    pkg_check_modules ( SDLMIXER REQUIRED SDL_mixer )\n    set ( SDLMIXER_LIBRARY ${SDLMIXER_STATIC_LIBRARIES} )|' src/CMakeLists.txt

          rm -rf deps
          mkdir -p build
          cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDEV_BUILD=OFF \
            -DBUILD_PACKAGE=OFF \
            -DPKG_CONFIG_ARGN="--static" \
            -DCMAKE_CXX_FLAGS="-s -static -DYAML_CPP_STATIC_DEFINE" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++ -Wl,--strip-all"

          cmake --build . --config Release --parallel $(nproc)
          cp bin/openxcom.exe ../bin/openxcom.exe
          cd ../bin
          zip -r "${{ steps.version.outputs.artifact_name }}.zip" ./*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}.zip
          path: bin
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.artifact_name }}
          name: ${{ steps.version.outputs.artifact_name }}
          files: bin/${{ steps.version.outputs.artifact_name }}.zip
